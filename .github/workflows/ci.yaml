name: CI

# Lint and the tests. Release calls the same workflow, so a version is published only
# after exactly these checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A fixed name, not github.workflow: called from Release, github.workflow is "Release",
# and a group equal to the caller's own cancels the caller.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  HATCH_VERSION: "1.18.2"

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Hatch
        run: pipx install hatch==${{ env.HATCH_VERSION }}
      - name: Lint
        run: hatch check code
      - name: Format
        run: hatch check fmt

  unit-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Hatch
        run: pipx install hatch==${{ env.HATCH_VERSION }}
      - name: Run unit tests
        run: hatch test --all --randomize
